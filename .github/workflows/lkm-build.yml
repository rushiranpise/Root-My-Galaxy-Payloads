name: LKM

# Builds the out-of-tree kernel modules we ship outside KernelSU - today just lkm/permissive, which
# writes `struct selinux_state.enforcing` to put SELinux into permissive mode from the kernel side.
#
# Two things make this a workflow rather than a `make` in the README.
#
# The first is the stamp. The module must know the byte offset of that field, and the offset is a
# property of the kernel it will be loaded into: `enforcing` exists only under
# CONFIG_SECURITY_SELINUX_DEVELOP, the struct is `__randomize_layout` so CONFIG_RANDSTRUCT shuffles
# it, and a vendor kernel puts its own members in the middle of it - Samsung's do, measurable on the
# S25 Ultra this was written against. So the offset is derived from the kernel's own BTF for each KMI
# this builds, never remembered, and the receipt says which route answered. A build whose derivation
# fails does not get to guess: it ships with -1, which makes the module refuse to write at all
# unless its caller passes `offset=` at load.
#
# The second is that the rule guarding the write is host-testable, and a rule that guards a write
# into kernel memory should be tested on every change rather than on the machine of whoever
# remembers to run `make test`. `host-test` runs it on a runner, no container, no kernel tree.
#
# It builds, it does not publish: the module is an artifact. The feed has no entry for it and nothing
# stages or loads it yet - see lkm/permissive/README.md for what that wiring still needs.

on:
  workflow_call:
    inputs:
      kmi:
        description: 'KMIs to build for, as a JSON array'
        required: false
        type: string
        default: '["android15-6.6"]'
      ddk_release:
        description: 'DDK image release'
        required: false
        type: string
        default: '20260828'
      enforcing_offset:
        description: 'Fallback stamp when the DDK carries no BTF to derive one from; -1 refuses'
        required: false
        type: string
        default: '-1'
  workflow_dispatch:
    inputs:
      kmi:
        description: 'KMIs to build for, as a JSON array'
        required: true
        default: '["android15-6.6"]'
      ddk_release:
        description: 'DDK image release'
        required: true
        default: '20260828'
      enforcing_offset:
        description: 'Fallback stamp when the DDK carries no BTF to derive one from; -1 refuses'
        required: true
        default: '0'

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------------------------
  # The rule, on the host. selinux_layout.h is the same header the module includes, so this is the
  # actual decision the write is gated on - not a reimplementation of it - and it needs nothing but
  # a C compiler.
  #
  # The BTF reader is checked here too, against a synthetic blob, because its failure mode is the
  # interesting one: "I could not read this" and "this kernel has no such field" are different
  # answers that drive opposite decisions, and the tool has to keep them apart.
  # -------------------------------------------------------------------------------------------
  host-test:
    name: host test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payloads
        uses: actions/checkout@v7

      - name: The layout rule
        run: make -C lkm/permissive test

      - name: The BTF reader
        run: python3 tools/btf_selinux_layout.py --self-test

      - name: The module may not be built without a stamp, and may not claim one it has none of
        run: |
          # A default of -1 is what makes the module refuse to write, so the header must not carry a
          # remembered offset: the only number in it is the "nobody derived this" sentinel.
          if ! grep -q 'define RMG_ENFORCING_OFFSET (-1)' lkm/permissive/rmg_permissive.c; then
            echo "::error::rmg_permissive.c no longer defaults the offset to -1"
            exit 1
          fi
          if grep -rnE '^\s*static int offset = [0-9]' lkm/permissive/rmg_permissive.c; then
            echo "::error::the offset default is no longer the sentinel"
            exit 1
          fi

  permissive:
    name: permissive (${{ matrix.kmi }})
    needs: host-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: ${{ fromJSON(inputs.kmi || '["android15-6.6"]') }}
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-${{ inputs.ddk_release || '20260828' }}
      options: --privileged
    steps:
      - name: Checkout payloads
        uses: actions/checkout@v7

      - name: Derive the offset from this kernel's own types
        id: derive
        env:
          FALLBACK: ${{ inputs.enforcing_offset || '-1' }}
        run: |
          set -o pipefail
          : "${KDIR:?the DDK image is expected to set KDIR}"

          # The DDK's tree is what this module is compiled against, so its BTF is the authority when
          # it is there. Where it is not, the fallback input is used and the receipt says so - a
          # stamp nobody can trace back to a kernel is worse than no stamp, which is why the source
          # is recorded rather than just the number.
          found=""
          for cand in "$KDIR/vmlinux" "$KDIR/vmlinux.o" "$(dirname "$KDIR")/vmlinux"; do
            if [ -f "$cand" ]; then found="$cand"; break; fi
          done

          offset="$FALLBACK"
          source="input"
          if [ -n "$found" ]; then
            echo "reading $found"
            if python3 tools/btf_selinux_layout.py "$found"; then
              offset="$(python3 tools/btf_selinux_layout.py "$found" | sed -n 's/^offset=//p')"
              source="btf:$found"
            else
              echo "::warning::could not derive an offset from $found; using the fallback $FALLBACK"
            fi
          else
            echo "::warning::no vmlinux in the DDK to derive from; using the fallback $FALLBACK"
          fi

          echo "$offset" > /tmp/offset
          echo "$source" > /tmp/offset-source
          echo "offset: $offset (source: $source)"

      - name: Build it
        run: |
          set -o pipefail
          : "${KDIR:?the DDK image is expected to set KDIR}"
          make -C "$KDIR" M="$PWD/lkm/permissive" modules \
            RMG_ENFORCING_OFFSET="$(cat /tmp/offset)" 2>&1 | tee /tmp/lkm.log
          ls -l lkm/permissive/rmg_permissive.ko

      - name: It has to be GPL, because it binds a GPL-only symbol
        run: |
          # kernel/kallsyms.c exports kallsyms_on_each_symbol with EXPORT_SYMBOL_GPL. A module that
          # declares anything else is refused at load with "disagrees about version of symbol" or a
          # taint, which would read as a kernel problem rather than a build one.
          license="$(modinfo -F license lkm/permissive/rmg_permissive.ko)"
          echo "license: $license"
          case "$license" in
            GPL*|Dual*) ;;
            *) echo "::error::module license is '$license', not GPL-compatible"; exit 1 ;;
          esac

      - name: Record what was stamped, and against what
        env:
          KMI: ${{ matrix.kmi }}
          DDK_RELEASE: ${{ inputs.ddk_release || '20260828' }}
        run: |
          {
            echo "module=rmg_permissive"
            echo "kmi=${KMI}"
            echo "ddk_release=${DDK_RELEASE}"
            echo "offset=$(cat /tmp/offset)"
            echo "offset_source=$(cat /tmp/offset-source)"
            echo "vermagic=$(modinfo -F vermagic lkm/permissive/rmg_permissive.ko)"
            echo "sha256=$(sha256sum lkm/permissive/rmg_permissive.ko | cut -d' ' -f1)"
            echo "size=$(stat -c %s lkm/permissive/rmg_permissive.ko)"
          } | tee "lkm-receipt-${KMI}.txt"

      - name: Name it the way the feed would serve it
        env:
          KMI: ${{ matrix.kmi }}
        run: |
          # The same shape the KernelSU modules use, so a directory of ours reads consistently and a
          # loader can tell the two apart by name. Nothing serves it yet.
          out="${KMI}_rmg-permissive.ko"
          cp lkm/permissive/rmg_permissive.ko "$out"
          ls -l "$out"

      - name: Upload the module and its receipt
        uses: actions/upload-artifact@v7
        with:
          name: permissive-${{ matrix.kmi }}-${{ inputs.ddk_release || '20260828' }}
          path: |
            ${{ matrix.kmi }}_rmg-permissive.ko
            lkm-receipt-${{ matrix.kmi }}.txt
          if-no-files-found: error
